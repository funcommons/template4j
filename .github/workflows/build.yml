name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # nightly (UTC 18:30) full regression
    - cron: '30 18 * * *'

jobs:
  core:
    name: core (JDK 17, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build & test core (with JaCoCo coverage gate)
        run: mvn -B -pl template4j-core -am verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-core
          path: template4j-core/target/site/jacoco/
          retention-days: 30

      - name: Report core coverage summary
        if: success()
        run: |
          echo "### Core Coverage" >> $GITHUB_STEP_SUMMARY
          awk -F',' 'NR>1 {
            miss_inst+=$4; cov_inst+=$5;
            miss_br+=$6; cov_br+=$7;
            miss_line+=$8; cov_line+=$9;
          } END {
            printf "| Metric | Covered | Total | %% |\n";
            printf "|---|---|---|---|\n";
            printf "| INSTRUCTION | %d | %d | %.1f%% |\n", cov_inst, cov_inst+miss_inst, cov_inst/(cov_inst+miss_inst)*100;
            printf "| BRANCH | %d | %d | %.1f%% |\n", cov_br, cov_br+miss_br, (cov_br+miss_br>0?cov_br/(cov_br+miss_br)*100:0);
            printf "| LINE | %d | %d | %.1f%% |\n", cov_line, cov_line+miss_line, cov_line/(cov_line+miss_line)*100;
          }' template4j-core/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

  site:
    name: site (JDK 17, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build & test site (with JaCoCo coverage gate)
        run: mvn -B -pl template4j-site -am verify

      - name: Upload JaCoCo site coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-site
          path: template4j-site/target/site/jacoco/
          retention-days: 30

      - name: Report site coverage summary
        if: success()
        run: |
          echo "### Site Coverage" >> $GITHUB_STEP_SUMMARY
          awk -F',' 'NR>1 {
            miss_inst+=$4; cov_inst+=$5;
            miss_br+=$6; cov_br+=$7;
            miss_line+=$8; cov_line+=$9;
          } END {
            printf "| Metric | Covered | Total | %% |\n";
            printf "|---|---|---|---|\n";
            printf "| INSTRUCTION | %d | %d | %.1f%% |\n", cov_inst, cov_inst+miss_inst, cov_inst/(cov_inst+miss_inst)*100;
            printf "| BRANCH | %d | %d | %.1f%% |\n", cov_br, cov_br+miss_br, (cov_br+miss_br>0?cov_br/(cov_br+miss_br)*100:0);
            printf "| LINE | %d | %d | %.1f%% |\n", cov_line, cov_line+miss_line, cov_line/(cov_line+miss_line)*100;
          }' template4j-site/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

  shade:
    name: shade (fat jar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build fat jar
        run: mvn -B -Pshade -pl template4j-core -am package -DskipTests

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: template4j-core-shaded
          path: template4j-core/target/template4j-core-shaded.jar
          retention-days: 14

  benchmark:
    name: benchmark (no-gate, PR only)
    runs-on: ubuntu-latest
    needs: core
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run benchmarks (template4j-core)
        run: |
          mvn -B -pl template4j-core -am test -Pbenchmark -DfailIfNoTests=false 2>&1 | tee benchmark.log
          echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
          grep -E "===|Warm|Cold|ns/call" benchmark.log >> $GITHUB_STEP_SUMMARY || true

  frontend:
    name: frontend (node 22, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template4j-site/frontend/package-lock.json

      # --registry 覆盖 lockfile 里的 npmmirror resolved URL (本地开发写入):
      # 镜像故障时 CI 不陪葬 (2026-11-09 npmmirror DB 故障 → npm ci E500 实绩)。
      - name: Install frontend dependencies
        working-directory: template4j-site/frontend
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run frontend unit tests (vitest run)
        working-directory: template4j-site/frontend
        run: npm run test

      - name: Build frontend (vite build)
        working-directory: template4j-site/frontend
        run: npm run build

  e2e:
    name: e2e (smoke on PR/push, full regression nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: template4j-site/frontend/package-lock.json

      - name: Install & build frontend
        working-directory: template4j-site/frontend
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm run build

      - name: Package site jar
        run: mvn -B -pl template4j-site -am package -DskipTests

      - name: Install playwright (e2e imports it from a hardcoded global path)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm install playwright
          # e2e/lib/launch.mjs does: import('/opt/homebrew/lib/node_modules/playwright/index.mjs')
          sudo mkdir -p /opt/homebrew/lib/node_modules
          sudo ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" /opt/homebrew/lib/node_modules/playwright

      - name: Start site backend (port 8088) and wait until ready
        run: |
          # SSRF 白名单/base url 与 surefire 单测配置一致 (仅回环); e2e 高频 POST 关闭演示限流
          nohup java \
            -Dtemplate4j.rest.allowed-hosts=127.0.0.1,localhost,0.0.0.0 \
            -Dtemplate4j.rest.baseUrl=http://localhost:8088 \
            -Dtemplate4j.demo.rate-limit.enabled=false \
            -jar template4j-site/target/template4j-site.jar \
            > "$RUNNER_TEMP/site.log" 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/actuator/health || true)
            if [ "$code" != "000" ]; then echo "site is up (HTTP $code)"; exit 0; fi
            sleep 2
          done
          echo "site did not start; last log lines:"
          tail -50 "$RUNNER_TEMP/site.log"
          exit 1

      - name: Start vite dev server (port 5173) and wait until ready
        run: |
          cd template4j-site/frontend
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          started=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            if [ "$code" != "000" ]; then echo "vite is up (HTTP $code)"; started=1; break; fi
            sleep 2
          done
          if [ "$started" != "1" ]; then
            echo "vite did not start; last log lines:"
            tail -50 "$RUNNER_TEMP/vite.log"
            exit 1
          fi
          # 预热收敛: 冷启动首击会撞 504 (Outdated Optimize Dep) —— element-plus 经
          # unplugin resolver 懒发现, smoke 首页加载触发 re-optimization, 懒加载视图
          # (Learn.vue 等) 动态导入失败 (vite 8 CI 实绩, 2 issues 同根)。逐个 transform
          # 全部视图让依赖预构建收敛, 全部 200 后再跑 smoke。预热失败不在此处报警,
          # 真实错误交由 smoke 呈现。
          set +e
          for _ in $(seq 1 20); do
            ok=1
            for v in Home Learn Try Docs Showcase Mcp Perf Playground; do
              c=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5173/src/views/$v.vue" || true)
              if [ "$c" != "200" ]; then ok=0; fi
            done
            if [ "$ok" = "1" ]; then echo "dep optimization settled (all views 200)"; break; fi
            sleep 2
          done
          set -e

      - name: Run e2e smoke (PR / push)
        if: github.event_name != 'schedule'
        run: node e2e/e2e-smoke.mjs

      - name: Run e2e full regression (nightly)
        if: github.event_name == 'schedule'
        run: |
          export T4J_REPORT_SEQ="ci-${GITHUB_RUN_NUMBER}"
          fail=0
          for f in e2e/regression/bl-*.mjs; do
            echo "=== running $f"
            node "$f" || fail=1
          done
          node e2e/regression/gen-bl-report.mjs || true
          exit $fail

      - name: Upload e2e artifacts (screenshots & reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-shots/
            test-report/
          retention-days: 14
          if-no-files-found: ignore