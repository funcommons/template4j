name: security-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 07:30 UTC（北京时间 15:30）定期扫描
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR 门禁：仅做 diff 视角的依赖审查（秒级，无 NVD 冷启动），全量扫描留给 push main / 每周基线
  dependency-review:
    name: Dependency review (PR diff gate, fail on high)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # OWASP dependency-check 已移除 (2026-11-13): 无 NVD_API_KEY 时 NVD 限流
  # (5 请求/30s) 下全量同步 30+ 分钟且慢日必超时, 要么常驻 advisory 无牙,
  # 要么依赖用户申请 key。阻断职责由 Trivy (CRITICAL/HIGH, Trivy DB 免费自更新)
  # + PR Dependency review (required, high+) + Dependabot alerts 三层承担。

  trivy-fs:
    name: Trivy filesystem scan (CRITICAL/HIGH blocking)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 先把依赖填进本地 ~/.m2 再扫描: trivy 扫多模块 Maven 工程会逐 pom 直连 Maven
      # Central, 空 cache 时数千次请求会撞 429 全 IP 封禁 30min (2026-11-09 首跑实绩:
      # log4j-bom pom 429 → FATAL)。primed 之后 trivy 仅本地解析, 不再打 Central。
      - name: Prime local Maven cache
        run: mvn -B -ntp dependency:go-offline

      # 扫描仓库内配置文件 / lockfile / IaC，发现 CRITICAL 或 HIGH 即失败。
      # 版本 pin 死, 不跟 master 移动靶。
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: 'trivy-report.txt'

      - name: Print Trivy report
        if: always()
        run: cat trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: trivy-report.txt
          retention-days: 30
