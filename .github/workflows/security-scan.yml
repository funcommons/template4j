name: security-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 07:30 UTC（北京时间 15:30）定期扫描
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR 门禁：仅做 diff 视角的依赖审查（秒级，无 NVD 冷启动），全量扫描留给 push main / 每周基线
  dependency-review:
    name: Dependency review (PR diff gate, fail on high)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  dependency-check:
    name: OWASP dependency-check (fail on CVSS >= 9)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # 60min: 无 NVD_API_KEY 时全量同步物理下限 ~30+ 分钟 (限流 5 请求/30s),
    # NVD 慢日 (524) 下 40min 不够 (2026-11 实绩); NVD 数据库缓存跨 run 收敛,
    # 配置 NVD_API_KEY secret 后可大幅缩短。
    timeout-minutes: 60
    # 暂行警示不阻断: 无 key 的 NVD 同步在慢日连 60min 都不够 (2026-11-10 两次超时
    # 实绩), 缓存仍在跨 run 收敛。失败保留警示注记不没信号, 但不再把 main 打红。
    # >>> 移除条件: 用户配置 NVD_API_KEY secret 后删除本行 (gate 恢复阻断)。 <<<
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # NVD 数据库按周缓存: 首跑需全量拉取(可达 30min+), 之后走增量更新。
      # restore-keys 取最近一周缓存续用, 新周键落盘形成滚动快照。
      - name: Compute NVD cache week
        id: nvdweek
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: odc-nvd-${{ steps.nvdweek.outputs.week }}
          restore-keys: |
            odc-nvd-

      # 任一依赖 CVSS >= 9 阻断；关闭 RetireJS 分析器避免扫描超时。
      # failOnError=false: NVD API 偶发 524/限流不终止分析 (2026-11-09 首跑实绩:
      # 无 key 全量拉取撞上 NVD 524 → NoDataException 致命失败); 该次检测能力降级
      # (仅 Central 元数据), 随缓存累积与每周增量收敛。
      # NVD_API_KEY 为可选 secret (nvd.nist.gov 免费申请, `gh secret set NVD_API_KEY`),
      # 未配置时视为无 key, 不影响流程。
      - name: Run dependency-check
        run: >
          mvn -q org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=9 -DretireJsAnalyzerEnabled=false
          -DfailOnError=false -DnvdApiKey="${NVD_API_KEY}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/dependency-check-report.html'
          retention-days: 30

  trivy-fs:
    name: Trivy filesystem scan (CRITICAL/HIGH blocking)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 先把依赖填进本地 ~/.m2 再扫描: trivy 扫多模块 Maven 工程会逐 pom 直连 Maven
      # Central, 空 cache 时数千次请求会撞 429 全 IP 封禁 30min (2026-11-09 首跑实绩:
      # log4j-bom pom 429 → FATAL)。primed 之后 trivy 仅本地解析, 不再打 Central。
      - name: Prime local Maven cache
        run: mvn -B -ntp dependency:go-offline

      # 扫描仓库内配置文件 / lockfile / IaC，发现 CRITICAL 或 HIGH 即失败。
      # 版本 pin 死, 不跟 master 移动靶。
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: 'trivy-report.txt'

      - name: Print Trivy report
        if: always()
        run: cat trivy-report.txt

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-report
          path: trivy-report.txt
          retention-days: 30
