version: 2
updates:
  # Java deps (Maven)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:23"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps"
    groups:
      # 把 patch 升级打包成 1 个 PR, 减少 review 负担
      maven-patch:
        update-types:
          - "patch"
      # minor / major 单独开 PR
      maven-minor:
        update-types:
          - "minor"
      maven-major:
        update-types:
          - "major"
    ignore:
      # Spring Boot 大版本要手动评估 (Java 17 baseline 可能变)
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
