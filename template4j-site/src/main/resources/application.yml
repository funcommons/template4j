server:
  port: 8088

spring:
  application:
    name: template4j-site
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: true

template4j:
  demo:
    render-timeout-ms: 5000
    max-template-size: 65536
    rest-base-url: http://localhost:${server.port}
    rate-limit:
      enabled: true
      capacity: 10
      refill-minutes: 1

logging:
  level:
    root: INFO
    fun.commons.template4j: DEBUG
